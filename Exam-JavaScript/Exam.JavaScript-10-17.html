<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let cardTitle = "Elzero", 
            cardDesc = "Elzero Web School", 
            cardDate = "25/10";

        let markUp = `
            <div class="card">
                <h3>${cardTitle}</h3>
                <p>${cardDesc}</p>
                <span>${cardDate}</span>
            </div>
        `;

        document.write(markUp.repeat(4));
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson-60</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        h3 {
            background-color: black;
            color: white;
            padding: 10px auto;
            margin: 10px 0;
            text-align: center;
        }

        /* Start-Lesson-60-Grid-Parent-Complete Laypout With Template Areas */

        .lesson-60 {
            height: 100vh;
            background-color: #eee;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: 70px auto 70px;
            grid-template-areas: "logo logo logo nav nav nav nav nav nav nav"
                "cont cont cont cont cont cont cont side side side"
                "foot foot foot foot foot foot foot foot foot foot";
        }

        h2 {
            grid-area: logo;
            background-color: red;
            color: white;
        }

        nav {
            grid-area: nav;
            background-color: blue;
            color: white;
        }

        ul {
            list-style: none;
        }

        ul li {
            display: inline-block;
        }

        section {
            grid-area: cont;
            background-color: yellow;
            color: white;
        }

        aside {
            grid-area: side;
            background-color: green;
            color: white;
        }

        footer {
            grid-area: foot;
            background-color: black;
            color: white;
        }

        /* End-Lesson-60-Grid-Parent-Complete Laypout With Template Areas */
    </style>
</head>

<body>
    <!-- Start Lesson-60-Grid-Parent-Complete Laypout With Template Areas-->
    <h3>Lesson-60-Grid-Parent-Complete Laypout With Template Areas</h3>
    <div class="lesson-60">
        <h2>Elzero</h2>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Content</li>
            </ul>
        </nav>
        <section>Content</section>
        <aside>Sidebar</aside>
        <footer>Footer</footer>
    </div>
    <!-- End Lesson--60-Grid-Parent-Complete Laypout With Template Areas -->
</body>

</html>

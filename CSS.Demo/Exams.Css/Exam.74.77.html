<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam.74-77</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h3 {
            padding: 5px;
            margin: 5px 0;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .e-1 {
            width: 50px;
            height: 50px;
            margin: 30px auto;
            border: 5px solid #e12182;
            border-radius: 50%;
            border-right-color: transparent;
            position: relative;
            animation: rotate 1s linear infinite;
        }

        .e-1::before {
            content: "";
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            width: 70px;
            height: 70px;
            border: 5px solid #2492E4;
            border-left-color: transparent;
            border-radius: 50%;
            z-index: -1;
        }

        .e-1::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            width: 90px;
            height: 90px;
            border: 5px solid #fca300;
            border-top-color: transparent;
            border-radius: 50%;
            z-index: -1;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0turn);
            }

            100% {
                transform: rotate(1turn);
            }
        }

        .e-1:hover {
            animation-play-state: paused;
        }

        /* Exam -2 */
        .e-2 {
            width: 50px;
            height: 50px;
            margin: 30px auto;
            border: 5px solid #2492E4;
            border-radius: 50%;
            border-bottom-color: transparent;
            position: relative;
            animation: rotate 1s linear 0s infinite;
            animation-play-state: paused;
        }

        .e-2::before {
            content: "";
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            width: 70px;
            height: 70px;
            border: 5px solid #fca300;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotate 1.6s linear .25s infinite;
            /* animation-delay: .25s; */
            animation-play-state: paused;
        }

        .e-2::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            width: 90px;
            height: 90px;
            border: 5px solid black;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotate 2.2s linear .5s infinite;
            /* animation-delay: .5; */
            animation-play-state: paused;
        }

        @keyframes rotate-1 {
            0% {
                transform: rotate(0turn);
            }

            100% {
                transform: rotate(1turn);
            }
        }

        .e-2:hover,
        .e-2:hover::before,
        .e-2:hover::after {
            animation-play-state: running;
        }

        /* Exam - 3  */
        .e-3 {
            display: block;
            width: 50px;
            height: 50px;
            margin: 20px auto;
            background-color: #ddd;
            border-radius: 50%;
            position: relative;
        }

        .e-3::before {
            content: "";
            position: absolute;
            top: 0px;
            left: 0px;
            bottom: 0px;
            right: 0px;
            border: 3px solid black;
            border-right-color: transparent;
            border-radius: 50%;
            animation: rotate 1s linear infinite reverse;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0turn);
            }

            100% {
                transform: rotate(1turn);
            }
        }

        /* Exam - 4 */
        .bo {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eee;
            /* لون خلفية الصفحة */
        }

        /* الحاوية لتجعل E و L بجانب بعضهما */
        .container {
            display: flex;
            gap: 20px;
            /* المسافة بين حرف E وحرف L */
            position: relative;
        }

        /* =========================================
   1. تصميم حرف E (Div كامل)
   ========================================= */
        .e-letter {
            width: 200px;
            height: 300px;
            background-color: #323232;
            /* لون الحرف الأسود يملأ الـ div بالكامل */
            position: relative;
        }

        /* التجويف العلوي لـ E */
        .e-letter::before {
            content: "";
            position: absolute;
            background-color: #eee;
            /* نفس لون خلفية الصفحة للتفريغ */
            top: 40px;
            right: 0;
            left: 40px;
            height: 85px;
        }

        /* التجويف السفلي لـ E */
        .e-letter::after {
            content: "";
            position: absolute;
            background-color: #eee;
            /* نفس لون خلفية الصفحة للتفريغ */
            bottom: 40px;
            right: 0;
            left: 40px;
            height: 85px;
        }

        /* =========================================
   2. تصميم حرف L (Div كامل)
   ========================================= */
        .l-letter {
            width: 200px;
            height: 300px;
            background-color: #323232;
            /* لون الحرف الأسود يملأ الـ div بالكامل */
            position: relative;
        }

        /* التجويف العلوي لـ L */
        .l-letter::before {
            content: "";
            position: absolute;
            background-color: #eee;
            /* نفس لون خلفية الصفحة للتفريغ */
            top: 0;
            right: 0;
            left: 40px;
            height: 260px;
        }

        /* =========================================
   3. المربعات الصفراء والحركة (Animation)
   ========================================= */

        /* المربع الأول في L */
        .l-letter::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #fea604;
            bottom: 5px;
            right: 5px;
            animation: move-l 3s linear infinite;
            opacity: 0;
        }

        /* المربع الثاني في E */
        .container::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #fea604;
            top: 5px;
            left: 165px;
            opacity: 0;
            animation: move-e 3s linear 3s infinite;
        }

        /* حركة المربع في L */
        /* @keyframes move-l {
            0% {
                bottom: 5px;
                right: 5px;
                opacity: 1;
            }

            30% {
                bottom: 5px;
                right: 165px;
                opacity: 1;
            }

            75% {
                bottom: 265px;
                right: 165px;
                opacity: 1;
            }

            80%,
            100% {
                bottom: 265px;
                right: 165px;
                opacity: 0;
            }
        }
        /* حركة المربع في E */
        /* حركة المربع في E */
        @keyframes move-e {
            0% {
                opacity: 1;
                top: 5px;
                left: 165px;
            }

            /* 1. التحرك يميناً لعمود اليسار */
            10% {
                top: 5px;
                left: 5px;
            }

            /* 2. النزول إلى مستوى الشرطة الوسطى */
            20% {
                top: 135px;
                left: 5px;
            }

            /* 3. الخروج للشرطة الوسطى */
            30% {
                top: 135px;
                left: 165px;
            }

            /* 4. الرجوع إلى عمود اليسار */
            40% {
                top: 135px;
                left: 5px;
            }

            /* 5. النزول لأسفل اليسار مباشرة بدون المرور بالوسط */
            50% {
                top: 265px;
                left: 5px;
            }

            /* 6. الوصول إلى يمين الشرطة السفلى */
            60% {
                top: 265px;
                left: 165px;
            }

            /* 7. الرجوع لحظياً لعمود اليسار في الأسفل قبل النهاية مباشرة */
            70% {
                top: 265px;
                left: 5px;
            }

            /* 8. العودة اللحظية إلى أعلى اليسار لتبدأ الدورة الجديدة فوراً رأساً لأعلى */
            100% {
                opacity: 1;
                top: 5px;
                left: 5px;
            }
        }
    </style>
</head>

<body>
    <h3>Exam - 1 </h3>
    <div class="e-1"></div>
    <hr>
    <hr>
    <hr>
    <h3>Exam - 2 </h3>
    <div class="e-2"></div>
    <h3>Exam - 3</h3>
    <span class="e-3"></span>
    <h3>Exam - 4</h3>
    <div class="bo">
        <div class="container">
            <div class="e-letter"></div>
            <div class="l-letter"></div>
        </div>
    </div>
</body>

</html>

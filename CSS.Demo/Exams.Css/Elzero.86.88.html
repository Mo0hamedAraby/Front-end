<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .e-1 {
            background-color: #ddd;
            width: 200px;
            height: 200px;
        }

        .center-flex {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-position {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .circle-100 {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .circle-200 {
            width: 200px;
            height: 200px;
            border-radius: 50%;
        }

        .arrow {
            position: relative;
            display: flex;
            align-items: center;
            width: 300px;
            height: 50px;
            background-color: #ddd;
            margin: 20px auto;
            padding-left: 10px;
        }

        .arrow.top::before,
        .arrow.right::before,
        .arrow.bottom::before,
        .arrow.left::before {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: solid 15px transparent;
        }

        .arrow.top::before {
            border-bottom-color: #ddd;
            left: 50%;
            transform: translateX(-50%);
            top: -25px;
        }

        .arrow.right::before {
            border-left-color: #ddd;
            top: 50%;
            transform: translatey(-50%);
            right: -25px;
        }

        .arrow.bottom::before {
            border-top-color: #ddd;
            left: 50%;
            transform: translatex(-50%);
            bottom: -25px;
        }

        .arrow.left::before {
            border-right-color: #ddd;
            top: 50%;
            transform: translatey(-50%);
            left: -25px;
        }
    </style>
</head>

<body>
    <div class="e-1 center-position center-flex ">
        12345678
    </div>
    <div class="arrow top">Elzero</div>
    <div class="arrow right">Elzero</div>
    <div class="arrow bottom">Elzero</div>
    <div class="arrow left">Elzero</div>
</body>

</html>
